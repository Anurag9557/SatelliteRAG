# Aditya-L1
#
# This file is optional. Put the documents in documents/ and the
# type of each one is recognised from its name.
#
# To point a document type at a specific file, add:
#
# documents:
#   FCP:
#     file: my_procedures.pdf

name: Aditya-L1
slug: aditya-l1
embedding:
  model: minilm-l6

# The real Aditya-L1 mission documents are confidential, so this dataset
# uses ISRO/ISSDC's public documents instead. They are generic prose
# documents, so they are routed explicitly (config always wins over
# filename detection) into the four generic slots rather than left for
# filename-pattern guessing.
documents:
  MOR:
    file: adityal1_mission_booklet_mor.pdf
  OPS_MANUAL:
    file: adityal1_spacecraft_orbit_ops_manual.pdf
  GUIDELINES:
    file: adityal1_announcement_of_opportunity_guidelines.pdf
  HANDBOOK:
    file: adityal1_mission_brochure_handbook.pdf

chunking:
  FCP:
    max_chars: 2500
    overlap: 200
  MOR:
    max_chars: 1000
    overlap: 150
  OPS_MANUAL:
    max_chars: 1200
    overlap: 200
  GUIDELINES:
    max_chars: 1200
    overlap: 200
  HANDBOOK:
    max_chars: 1200
    overlap: 200
retrieval:
  top_k: 5
  rrf_k: 60
  n_dense: 20
  n_bm25: 20
  rerank: true
  rerank_pool: 20
  rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  # How a question is routed: rules, soft or llm (see core/router.py).
  router: soft
